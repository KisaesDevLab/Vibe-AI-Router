name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/kisaesdevlab/vibe-ai-router
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # The appliance manifest pulls `:latest` (image.defaultTag), so a release that
            # publishes only version tags leaves `vibe enable vibe-ai-router` unable to pull.
            # Excluded for pre-releases (e.g. v0.0.2-rc.1) so an rc never becomes `latest`.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: SBOM (14.3)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/kisaesdevlab/vibe-ai-router:${{ steps.meta.outputs.version }}
          format: spdx-json
          artifact-name: vibe-ai-router-sbom.spdx.json
