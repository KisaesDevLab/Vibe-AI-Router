name: CI
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airouter
          POSTGRES_PASSWORD: airouter
          POSTGRES_DB: airouter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U airouter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://airouter:airouter@localhost:5432/airouter
      VIBE_ROUTER_TEST_DATABASE_URL: postgres://airouter:airouter@localhost:5432/airouter
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      # No `version:` here on purpose — package.json's `packageManager` field is the single
      # source of truth (it also pins corepack in the Dockerfile). Specifying both makes
      # pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v5
      # PINNED AT v5 DELIBERATELY — do not bump to v6/v7. setup-node v6 limits automatic
      # caching to npm (actions/setup-node#1374), which breaks `cache: pnpm` below. v5 is the
      # lowest major running on Node 24, so it clears the Node 20 deprecation without that
      # regression. Revisit only with a pnpm caching story that survives v6+.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Dependency audit (14.3)
        run: pnpm audit --prod --audit-level high
      - name: Migration reversibility (up → down → up)
        run: |
          pnpm migrate
          pnpm migrate:down 999
          pnpm migrate
      - run: pnpm test
      - run: pnpm build
      - name: UI build
        run: pnpm --filter @vibe-ai-router/ui build
      - name: E2E smoke (Playwright)
        run: |
          pnpm --filter @vibe-ai-router/ui exec playwright install --with-deps chromium
          pnpm --filter @vibe-ai-router/ui exec playwright test
      - name: Docker build
        run: docker build -t vibe-ai-router:ci .
